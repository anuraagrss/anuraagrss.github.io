<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="images/Logo.ico" type="image/x-icon">
  <title>Arey...</title>
  <meta property="og:image" content="images/late-sun/key.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=JetBrains+Mono:wght@400&family=Lora:ital,wght@1,400;1,600&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link href="css/late-sun.css" rel="stylesheet">
  <link href="css/book.css" rel="stylesheet">
  <link href="css/journal.css" rel="stylesheet">
  <link href="css/journey.css" rel="stylesheet">
</head>
<body>

  <!-- ── THE ARRIVAL: fire, his words, the walk, the door ── -->
  <section class="scene" id="scene" aria-label="Arey walks toward the horizon">
    <div class="plate" id="plate"></div>
    <div class="drawn">
      <div class="sky"></div>
      <div class="door" id="door"></div>
      <div class="horizon"></div>
      <div class="water"></div>
      <div class="spit"></div>
      <div class="shore"></div>
    </div>
    <div class="steps" id="sceneSteps"></div>
    <div class="fire" id="fire"><i></i><i></i><i></i></div>
    <canvas class="embers" id="embers"></canvas>
    <div class="walker" id="walker">
      <img id="walkerImg" alt="" hidden>
      <svg id="walkerSvg" viewBox="0 0 40 110" aria-hidden="true">
        <circle cx="20" cy="11" r="8"/>
        <path d="M9 24 Q20 19 31 24 L33 62 L26 62 L25 104 L19 104 L20 66 L19 104 L13 104 L13 62 L7 62 Z"/>
      </svg>
    </div>
    <video class="walk-video" id="walkVideo" muted playsinline preload="auto" hidden></video>

    <!-- his words, as the production intro sets them; one line stays on top while he walks -->
    <div class="intro" id="intro" aria-live="polite"></div>
    <p class="topline" id="topline"></p>
    <p class="sig" id="sig"><span class="arey">Arey<span class="arey-dots">...<i></i></span></span></p>
    <button class="walk-in" id="w3" type="button">walk in ↓</button>

    <button class="sound" id="fireSound" type="button" hidden>▸ the fire, the wind</button>
    <audio id="fireAudio" preload="none"></audio>
  </section>

  <!-- ── THE JOURNEY: trips on both sides of the path ── -->
  <p class="epigraph" id="epiHero"></p>
  <main class="trail" id="trail" aria-label="trips">
    <div class="trail-steps" id="trailSteps" aria-hidden="true"></div>
    <div class="stops" id="stops"><p class="loading">opening my journals…</p></div>
    <p class="faint-places" id="faint" hidden></p>
  </main>
  <p class="epigraph after" id="epiExp"></p>
  <!-- ── THE BENCH: the walk ends here, and the poem writes itself if you stay ── -->
  <section class="j-bench" id="jBench" aria-label="the bench">
    <div class="clouds"><i></i><i></i><i></i></div>
    <svg class="jb-sk" viewBox="0 0 220 120" aria-hidden="true">
      <path d="M20 58 L200 54"/><path d="M18 66 L202 62"/><path d="M22 40 Q110 30 198 36"/><path d="M24 48 L196 44"/>
      <path d="M40 66 L36 108"/><path d="M180 62 L184 106"/><path d="M48 66 L50 104"/><path d="M172 62 L170 104"/>
      <path d="M6 110 Q110 104 214 110" class="ground"/></svg>
    <p class="jb-h">stay a while.</p>
    <p class="jb-sub">the road will wait. so will the light.</p>
    <div class="jb-poem" id="jbPoem"></div>
  </section>

  <section class="journey-end">
    <a class="open-journal" href="journal.html">
      <span class="mini-cover" aria-hidden="true">
        <i class="mc-title">THE WORLD<br>IS PROOF<br>I AM <b>ALIVE.</b></i>
        <img src="images/photographer-cut.png" alt="">
        <i class="mc-strap"></i>
      </span>
      <span class="oj-text">open my journal →</span>
    </a>
    <p>my letters, the road I walked, and how far it's been.</p>
  </section>

  <script type="module" src="js/late-sun-scene.js"></script>
  <script type="module" src="js/journey.js"></script>
  <script type="module" src="js/nav.js"></script>
</body>
</html>
